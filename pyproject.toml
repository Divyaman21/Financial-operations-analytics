[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-operations-analytics"
version = "0.1.0"
description = "End-to-end financial operations analytics: forecasting, churn, profitability, BI exports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1.0,<3",
  "numpy>=1.26.0,<3",
  "scikit-learn>=1.3.0,<2",
  "matplotlib>=3.8.0,<4",
  "statsmodels>=0.14.0,<1",
  "scipy>=1.11.0,<2",
  "pyarrow>=14.0.0,<19",
  "xgboost>=2.0.0,<3",
  "lightgbm>=4.0.0,<5",
  "lifelines>=0.27.0,<1",
  "prophet>=1.1.5,<2",
  "plotly>=5.18.0,<6",
  "shap>=0.45.0,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.109.0,<1", "uvicorn[standard]>=0.27.0,<1"]
tune = ["optuna>=3.5.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
