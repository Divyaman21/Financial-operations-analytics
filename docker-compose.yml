version: '3.8'

services:
  analytics:
    build: .
    container_name: financial-analytics
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RANDOM_SEED=42
    command: python run_pipeline.py

  api:
    build: .
    container_name: financial-api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - analytics
